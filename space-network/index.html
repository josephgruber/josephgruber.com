    <div class="cover-container d-flex h-100 mx-auto align-items-center">
        <main role="main" class="inner cover">
            <h1 class="title">Sign Up for <i>Space Network</i> Slack</h1>
            <p class="small font-italic">Sign-up directly at <a
                    href="https://space-comm.slack.com/signup">https://space-comm.slack.com/signup</a> with a known
                space industry email (e.g. nasa.gov, spacex.com, etc.)</p>

            <form class="text-left" id="invite-request" method="post" action="https://formspree.io/mqkbypjr"
                role="form">
                <input type="hidden" name="_subject" value="Space Network Invite Request" />
                <input type="text" name="_gotcha" style="display:none" />
                <div class="form-group row">
                    <label for="email" class="col-sm-3 col-form-label">Email Address</label>
                    <div class="col-sm-9">
                        <input type="email" name="email" class="form-control" id="email" placeholder="email@example.com"
                            required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="reference" class="col-sm-3 col-form-label">How did you hear about <i>Space
                            Network</i>?</label>
                    <div class="col-sm-9">
                        <input type="text" name="reference" class="form-control" id="reference"
                            placeholder="If referred, please let us know by who">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="connectionTextArea" class="col-sm-3 col-form-label">What is your connection to the
                        space industry?</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" name="connection" id="connectionTextArea" rows="3"
                            required></textarea>
                    </div>
                </div>
                <div class="text-center"><button id="form-button" class="btn btn-dark">Submit</button></div>
            </form>
            <p id="form-status" class="text-left"></p>
        </main>
    </div>

    <script>
        window.addEventListener("DOMContentLoaded", function () {
            var form = document.getElementById("invite-request");
            var button = document.getElementById("form-button");
            var status = document.getElementById("form-status");

            function success() {
                form.reset();
                form.style = "display: none;"
                status.innerHTML = "<p>Your invite request to <i>Space Network</i> has been received. Your invite will be sent by one of the admins as soon as possible.</p> \
                <p>A few tips for the <i>Space Network</i> Slack while you wait:</p> \
                <ol> \
                    <li>Go and introduce yourself on #intros. Tell us about yourself.</li> \
                    <li>If your favorite topic isn’t being discussed, create it. <b>Channels are free.</b> Announce your newly created channel on #general.</li> \
                    <li>If you know someone who should be here, ping @admins in the Slack, or send them to this webpage.</li> \
                    <li>Be cautious of what you post. Slack is not ITAR-compliant and company properietary information should not be posted.</li> \
                    <li>Avoid overt commercial activity or sales.</li> \
                </ol>";
            }

            function error() {
                status.innerHTML = "Oops! There was a problem.";
            }

            form.addEventListener("submit", function (ev) {
                ev.preventDefault();
                var data = new FormData(form);
                ajax(form.method, form.action, data, success, error);
            });
        });

        function ajax(method, url, data, success, error) {
            var xhr = new XMLHttpRequest();
            xhr.open(method, url);
            xhr.setRequestHeader("Accept", "application/json");
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== XMLHttpRequest.DONE) return;
                if (xhr.status === 200) {
                    success(xhr.response, xhr.responseType);
                } else {
                    error(xhr.status, xhr.response, xhr.responseType);
                }
            };
            xhr.send(data);
        }
    </script>
