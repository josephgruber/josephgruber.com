    <div class="cover-container d-flex h-100 mx-auto align-items-center">
        <main role="main" class="inner cover">
            <h1 class="title">Sign Up for <i>Space Network</i> Slack</h1>
            <p class="small font-italic">Sign-up directly at <a
                    href="https://space-comm.slack.com/signup">https://space-comm.slack.com/signup</a> with an known
                space industry email (e.g. nasa.gov, spacex.com, etc.)</p>
            <form class="text-left">
                <div class="form-group row">
                    <label for="email" class="col-sm-3 col-form-label">Email Address</label>
                    <div class="col-sm-9">
                        <input type="email" class="form-control" id="email" placeholder="email@example.com" required>
                    </div>
                </div>
                <div class="form-group row">
                    <label for="reference" class="col-sm-3 col-form-label">How did you hear about <i>Space
                            Network</i>?</label>
                    <div class="col-sm-9">
                        <input type="text" class="form-control" id="reference"
                            placeholder="If referred, please let us know by who">
                    </div>
                </div>
                <div class="form-group row">
                    <label for="connectionTextArea" class="col-sm-3 col-form-label">What is your connection to the
                        space industry?</label>
                    <div class="col-sm-9">
                        <textarea class="form-control" id="connectionTextArea" rows="3" required></textarea>
                    </div>
                </div>
                <div class="text-center"><button type="submit" class="btn btn-dark">Submit</button></div>
            </form>
        </main>
    </div>
